<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">GenZ NewZ icon</title>
  <desc id="desc">Square icon derived from the GenZ NewZ homepage logo.</desc>

  <g transform="translate(38 54) rotate(-3 218 202)">
    <rect x="0" y="0" width="436" height="404" fill="#000" stroke="#000" stroke-width="14" />

    <rect x="0" y="0" width="254" height="256" fill="#fff" />
    <rect x="0" y="256" width="254" height="148" fill="#000" />
    <line x1="0" y1="256" x2="254" y2="256" stroke="#000" stroke-width="8" />

    <circle cx="232" cy="42" r="28" fill="#000" />

    <text x="34" y="206"
